name: CI/CD Pipeline - Netlify Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Build, Lint & Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML5 Syntax & Static Asset Paths
        run: |
          echo "Validating static assets and HTML files..."
          ls -la index.html catalog.html product-detail.html about.html contact.html disclaimers.html
          echo "All core static HTML pages present."

      - name: Deploy to Netlify (Production or Preview)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NOTICE: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID secrets not yet configured."
            echo "If connecting Netlify directly via Git integration, Netlify will auto-deploy on push."
            echo "If using GitHub Actions CLI deploy, please add these secrets to your repository settings."
          else
            echo "Deploying site to Netlify..."
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              npx netlify-cli deploy --prod --dir=. --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
            else
              npx netlify-cli deploy --dir=. --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
            fi
          fi
